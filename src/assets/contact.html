<!DOCTYPE html>
<html>
    <head>
        <title>Contact</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.min.css" />
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <h1 class="logo">
                <a href="index.html">Luke Trusheim</a>
            </h1>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <!-- <li><a href="blog.html">Blog</a></li> -->
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <main>
            <h1 class="page-title">Contact</h1>
            <form id="contact-form" action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                
                <button type="submit" class="button link-button">Send message</button>
            </form>
        </main>
        <div class="footer-placeholder"></div>
        <script> 
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementsByClassName('footer-placeholder')[0].innerHTML = data;
                })
                .catch(error => console.error('Error loading footer:', error));
        </script>
    </body>
</html>
<script src="scripts.js"></script>
